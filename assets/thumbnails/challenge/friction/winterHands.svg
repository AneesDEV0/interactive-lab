  <!-- Pom-pom & Beanie -->
  <circle cx="105" cy="36" r="8" fill="#f5c838" stroke="#8c6218" stroke-width="2"/>
  <path d="M80 62c0-16 11-24 25-24s25 8 25 24z" fill="#f5c838" stroke="#8c6218" stroke-width="2"/>
  <rect x="78" y="57" width="54" height="9" rx="4.5" fill="#eab308" stroke="#8c6218" stroke-width="2"/>
  <!-- Face -->
  <circle cx="105" cy="76" r="19" fill="#fad2b0" stroke="#7c4f2b" stroke-width="2"/>
  <circle cx="98" cy="74" r="2.2" fill="#241c2c"/>
  <circle cx="112" cy="74" r="2.2" fill="#241c2c"/>
  <circle cx="92" cy="80" r="3.8" fill="#f48c7f" opacity="0.65"/>
  <circle cx="118" cy="80" r="3.8" fill="#f48c7f" opacity="0.65"/>
  <path d="M100 83q5 5 10 0" fill="none" stroke="#7c4f2b" stroke-width="2" stroke-linecap="round"/>
