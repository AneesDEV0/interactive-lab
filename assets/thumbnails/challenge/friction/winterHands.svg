  <path d="M74 102h62l8 46H66z" fill="#2589e8" stroke="#1e4e8c" stroke-width="2" stroke-linejoin="round"/>
  <line x1="105" y1="102" x2="105" y2="148" stroke="#e03b3b" stroke-width="4"/>
  <!-- Rubbing Hands in yellow mittens -->
  <ellipse cx="118" cy="116" rx="10" ry="13" transform="rotate(-15 118 116)" fill="#f5c838" stroke="#8c6218" stroke-width="2"/>
  <ellipse cx="126" cy="116" rx="10" ry="13" transform="rotate(15 126 116)" fill="#fde047" stroke="#8c6218" stroke-width="2"/>
  <!-- Warmth / Friction waves -->
  <path d="M142 102q5-4 10 0t10 0M144 114q5-4 10 0t10 0M142 126q5-4 10 0t10 0" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="168" text-anchor="middle" font-family="Tajawal, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e7b4c">افرك يديك معًا!</text>
