<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <rect x="0" y="0" width="160" height="120" rx="14" fill="#f3f0f7"/>
  <!-- مقبس جداري ثنائي أو ثلاثي -->
  <rect x="30" y="25" width="80" height="75" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="2"/>
  <rect x="42" y="38" width="56" height="50" rx="6" fill="#edf2f7"/>
  <!-- فتحات المقبس الجداري -->
  <rect x="52" y="52" width="6" height="14" rx="2" fill="#2d3748"/>
  <rect x="80" y="52" width="6" height="14" rx="2" fill="#2d3748"/>
  <rect x="66" y="72" width="6" height="10" rx="2" fill="#2d3748"/>
  <!-- مقص معدني يدخل مباشرة في إحدى فتحات المقبس -->
  <g transform="rotate(35 85 58)">
    <!-- شفرات المقص المعدنية الفضية -->
    <polygon points="85,55 125,50 120,60" fill="#a0aec0" stroke="#718096" stroke-width="1.2"/>
    <polygon points="85,60 125,65 120,55" fill="#cbd5e0" stroke="#718096" stroke-width="1.2"/>
    <!-- مسمار المفصل -->
    <circle cx="95" cy="57" r="3" fill="#e53e3e"/>
    <!-- مقبض المقص الأزرق -->
    <circle cx="134" cy="46" r="10" fill="none" stroke="#3182ce" stroke-width="4.5"/>
    <circle cx="134" cy="68" r="10" fill="none" stroke="#3182ce" stroke-width="4.5"/>
  </g>
  <!-- شرارة صعق عند نقطة دخول المعدن -->
  
  <!-- علامة خطر مميت -->
  
</svg>