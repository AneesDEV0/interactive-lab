    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#113e37" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- ظل الكرة على الأرض -->
