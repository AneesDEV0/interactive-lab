<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <rect x="0" y="0" width="160" height="120" rx="14" fill="#fff5f5"/>
  <!-- مقبس وشاحن بالجدار -->
  <rect x="122" y="18" width="24" height="30" rx="4" fill="#edf2f7" stroke="#cbd5e0"/>
  <rect x="114" y="25" width="16" height="16" rx="3" fill="#ffffff" stroke="#a0aec0"/>
  <!-- سلك يمتد نحو فم الرضيع -->
  <path d="M114,33 Q85,45 68,66" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M114,33 Q85,45 68,66" fill="none" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- وجه الرضيع اللطيف المحاط بالخطر -->
  <circle cx="50" cy="65" r="28" fill="#feebc8"/>
  <!-- شعر ناعم -->
  <path d="M30,50 Q50,38 70,52" fill="#b7791f"/>
  <!-- عينان بريئتان -->
  <circle cx="42" cy="62" r="3" fill="#2d3748"/>
  <circle cx="58" cy="62" r="3" fill="#2d3748"/>
  <!-- الفم ممسك بالسلك الكهربائي -->
  <ellipse cx="50" cy="74" rx="7" ry="5" fill="#e53e3e"/>
  <!-- السلك داخل الفم وخارجه -->
  <path d="M68,66 C60,72 45,74 30,78" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M68,66 C60,72 45,74 30,78" fill="none" stroke="#cbd5e0" stroke-width="3.5"/>
  <!-- شرارة صعق محذرة عند الفم -->
  <polygon points="56,70 60,65 65,72 61,72 63,77 58,73 54,75" fill="#ecc94b" stroke="#dd6b20" stroke-width="0.8"/>
  <!-- مثلث التحذير -->
  <circle cx="20" cy="22" r="12" fill="#e53e3e"/>
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">⚡</text>
</svg>