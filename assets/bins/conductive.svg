<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="condBoxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8874c0"/>
      <stop offset="100%" stop-color="#55408e"/>
    </linearGradient>
    <linearGradient id="condBulbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="60%" stop-color="#ffdb76"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <filter id="condGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- الصندوق الحاوي ثلاثي الأبعاد -->
  <path d="M20 70 L80 40 L140 70 L140 120 L80 148 L20 120 Z" fill="url(#condBoxGrad)" opacity="0.95"/>
  <path d="M20 70 L80 98 L140 70" stroke="#a793dc" stroke-width="2.5" fill="none"/>
  <path d="M80 98 L80 148" stroke="#a793dc" stroke-width="2.5"/>

  <!-- هالة التوهج والإضاءة للمصباح الموصل -->
  <circle cx="80" cy="50" r="32" fill="#ffdb76" opacity="0.35" filter="url(#condGlow)"/>

  <!-- المصباح المضيء في المنتصف -->
  <g transform="translate(80 52)">
    <!-- أشعة الإشعاع الكهربائي -->
    <line x1="0" y1="-28" x2="0" y2="-36" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="-22" x2="28" y2="-28" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
    <line x1="-22" y1="-22" x2="-28" y2="-28" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="0" x2="36" y2="0" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
    <line x1="-28" y1="0" x2="-36" y2="0" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>

    <!-- زجاج المصباح -->
    <path d="M-16 -6 C-18 -20 18 -20 16 -6 C15 4 8 9 7 14 L-7 14 C-8 9 -15 4 -16 -6 Z" fill="url(#condBulbGrad)"/>
    <!-- فتيل المصباح -->
    <path d="M-5 -2 L0 -8 L5 -2" stroke="#d35400" stroke-width="1.8" fill="none"/>
    <!-- قاعدة المصباح المعدنية الحلزونية -->
    <rect x="-7" y="14" width="14" height="4" rx="1.5" fill="#bdc3c7"/>
    <rect x="-6" y="19" width="12" height="3" rx="1.5" fill="#95a5a6"/>
    <ellipse cx="0" cy="23" rx="4" ry="2" fill="#34495e"/>
    <!-- شرارة كهربائية ⚡ -->
    <path d="M-3 -14 L2 -6 L-1 -6 L3 2 L-2 -3 L1 -3 Z" fill="#ffffff"/>
  </g>
</svg>
